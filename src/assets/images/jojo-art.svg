<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Key art: a child walking a ruined street at golden hour">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#14080B" />
      <stop offset="0.34" stop-color="#4E1607" />
      <stop offset="0.58" stop-color="#D9500F" />
      <stop offset="0.78" stop-color="#FF8A2B" />
      <stop offset="1" stop-color="#FFC978" />
    </linearGradient>
    <radialGradient id="glow" cx="0.7" cy="0.64" r="0.42">
      <stop offset="0" stop-color="#FFF0D2" stop-opacity="0.95" />
      <stop offset="0.4" stop-color="#FFA64A" stop-opacity="0.55" />
      <stop offset="1" stop-color="#FF6B1A" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2C1208" />
      <stop offset="0.5" stop-color="#160C08" />
      <stop offset="1" stop-color="#08090B" />
    </linearGradient>
    <linearGradient id="road" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1E1109" />
      <stop offset="1" stop-color="#0A0A0C" />
    </linearGradient>
    <radialGradient id="vig" cx="0.5" cy="0.48" r="0.78">
      <stop offset="0.5" stop-color="#000000" stop-opacity="0" />
      <stop offset="1" stop-color="#000000" stop-opacity="0.72" />
    </radialGradient>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" stitchTiles="stitch" />
      <feColorMatrix type="saturate" values="0" />
    </filter>
  </defs>

  <rect width="1600" height="900" fill="url(#sky)" />
  <rect width="1600" height="900" fill="url(#glow)" />
  <circle cx="1120" cy="566" r="54" fill="#FFF3D8" opacity="0.9" />

  <!-- distant ridge -->
  <path d="M0 598 L170 546 L330 584 L520 528 L690 576 L880 522 L1090 572 L1310 530 L1600 584 L1600 646 L0 646 Z" fill="#3B1709" opacity="0.72" />

  <rect y="610" width="1600" height="290" fill="url(#ground)" />
  <path d="M636 610 L986 610 L1300 900 L330 900 Z" fill="url(#road)" />
  <path d="M800 640 h26 l7 40 h-40 Z M776 712 h74 l12 60 h-98 Z M742 812 h142 l16 74 h-174 Z" fill="#2A1A11" opacity="0.55" />

  <!-- ruined facades, left -->
  <path d="M0 612 V352 h92 v-74 h88 v126 h68 V292 h106 v158 h76 V398 h62 v214 Z" fill="#0B0809" />
  <path d="M28 380 h26 v34 h-26 Z M132 316 h26 v34 h-26 Z M246 330 h30 v38 h-30 Z M346 336 h28 v36 h-28 Z" fill="#241009" opacity="0.85" />

  <!-- ruined facades, right -->
  <path d="M1600 612 V336 h-118 v-62 h-98 v134 h-78 V282 h-112 v186 h-68 V424 h-76 v188 Z" fill="#0B0809" />
  <path d="M1470 320 h30 v38 h-30 Z M1356 342 h26 v34 h-26 Z M1240 320 h30 v40 h-30 Z M1146 448 h26 v34 h-26 Z" fill="#241009" opacity="0.85" />

  <!-- bare tree -->
  <g stroke="#0B0809" stroke-width="11" fill="none" stroke-linecap="round">
    <path d="M292 616 V470" />
    <path d="M292 512 L244 452 M292 540 L346 480 M292 476 L266 424 M292 494 L330 442" stroke-width="8" />
    <path d="M1372 616 V486" />
    <path d="M1372 528 L1330 476 M1372 556 L1418 502" stroke-width="8" />
  </g>

  <!-- power lines -->
  <path d="M0 300 L640 344 M1600 286 L980 340" stroke="#0B0809" stroke-width="4" fill="none" opacity="0.9" />

  <!-- the child -->
  <g transform="translate(846 716)" fill="#07070A">
    <ellipse cx="4" cy="6" rx="46" ry="9" opacity="0.55" />
    <rect x="-11" y="-20" width="9" height="22" rx="3" />
    <rect x="4" y="-20" width="9" height="22" rx="3" />
    <path d="M-19 -70 Q0 -79 19 -70 L24 -18 Q0 -8 -24 -18 Z" />
    <circle cx="0" cy="-86" r="12" />
    <path d="M-13 -92 Q0 -104 13 -92 L14 -86 L-14 -86 Z" />
    <path d="M-21 -66 L-31 -34 L-24 -31 L-14 -60 Z" />
    <path d="M21 -66 L31 -34 L24 -31 L14 -60 Z" />
  </g>

  <rect width="1600" height="900" fill="url(#vig)" />
  <rect width="1600" height="900" filter="url(#grain)" opacity="0.09" style="mix-blend-mode:overlay" />
</svg>
